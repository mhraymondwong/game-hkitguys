<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>《香港IT人》— 簡單版</title>
<style>
  :root {
    --sky-top: #1a3a6e;
    --sky-mid: #4a8fd4;
    --sky-warm: #f0a060;
    --sky-glow: #ffe8c8;
    --cloud: rgba(255, 255, 255, 0.55);
    --ink: #1a2433;
    --ink-soft: #3d4f66;
    --card: rgba(255, 252, 248, 0.88);
    --card-border: rgba(255, 255, 255, 0.65);
    --accent: #e87840;
    --accent-soft: #ffb080;
    --infra: #3a7ab8;
    --app: #c45c3a;
    --good: #2d8a5e;
    --shadow: 0 12px 40px rgba(30, 50, 90, 0.25);
    --radius: 16px;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: var(--font);
    color: var(--ink);
    background: #0d1b2a;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* —— 新海誠風空氛（原創 CSS，非版權圖）—— */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 70% 20%, rgba(255, 200, 140, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 25% 35%, rgba(120, 180, 255, 0.35) 0%, transparent 50%),
      linear-gradient(180deg,
        #1b3a72 0%,
        #3d6fb0 22%,
        #6a9fd4 42%,
        #c8b890 62%,
        #e89050 78%,
        #c06040 100%);
    animation: skyPulse 18s ease-in-out infinite alternate;
  }

  @keyframes skyPulse {
    from { filter: saturate(1) brightness(1); }
    to { filter: saturate(1.08) brightness(1.04); }
  }

  .shafts {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 40%, rgba(255, 245, 220, 0.12) 45%, transparent 50%),
      linear-gradient(125deg, transparent 55%, rgba(255, 230, 180, 0.1) 60%, transparent 68%),
      linear-gradient(108deg, transparent 20%, rgba(255, 255, 240, 0.08) 28%, transparent 35%);
    mix-blend-mode: screen;
  }

  .clouds {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 180px 40px at 15% 28%, var(--cloud) 0%, transparent 70%),
      radial-gradient(ellipse 220px 50px at 78% 22%, rgba(255,255,255,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 140px 35px at 55% 18%, rgba(255,255,255,0.3) 0%, transparent 70%);
    opacity: 0.85;
  }

  .city {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 22vh;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(180deg, transparent 0%, rgba(20, 30, 50, 0.35) 100%),
      repeating-linear-gradient(90deg,
        transparent 0 18px,
        rgba(20, 28, 45, 0.55) 18px 22px,
        transparent 22px 40px),
      linear-gradient(180deg, transparent 40%, rgba(15, 22, 40, 0.75) 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 35%);
  }

  .city::before {
    content: "";
    position: absolute;
    left: 8%; bottom: 0;
    width: 12%; height: 70%;
    background: rgba(18, 26, 42, 0.7);
    box-shadow:
      28vw 10% 0 -8%,
      45vw 0 0 5%,
      62vw 15% 0 -5%,
      78vw 5% 0 0;
  }

  .glow-orb {
    position: fixed;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 160, 0.55) 0%, transparent 70%);
    top: 8%; right: 12%;
    z-index: 1;
    pointer-events: none;
    filter: blur(8px);
    animation: orbFloat 12s ease-in-out infinite alternate;
  }

  @keyframes orbFloat {
    from { transform: translate(0, 0); opacity: 0.7; }
    to { transform: translate(-20px, 15px); opacity: 1; }
  }

  .app {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 520px;
  }

  .panel {
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 26px 24px;
    animation: fadeUp 0.45s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel.hidden { display: none; }

  .logo {
    text-align: center;
    margin-bottom: 8px;
  }

  .logo h1 {
    font-size: 1.85rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    background: linear-gradient(120deg, #1a3a6e 0%, #c45c3a 55%, #e87840 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .logo .sub {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }

  .art-note {
    margin-top: 10px;
    font-size: 0.7rem;
    color: #6a7a90;
    text-align: center;
    line-height: 1.4;
  }

  .step-tag {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    background: rgba(232, 120, 64, 0.12);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  h2 {
    font-size: 1.25rem;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .lead {
    font-size: 0.92rem;
    color: var(--ink-soft);
    line-height: 1.55;
    margin-bottom: 18px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice {
    text-align: left;
    width: 100%;
    border: 1.5px solid rgba(80, 110, 150, 0.25);
    background: rgba(255, 255, 255, 0.72);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    font-family: inherit;
    color: var(--ink);
  }

  .choice:hover, .choice:focus {
    border-color: var(--accent-soft);
    box-shadow: 0 4px 16px rgba(232, 120, 64, 0.18);
    transform: translateY(-1px);
    outline: none;
  }

  .choice.selected {
    border-color: var(--accent);
    background: rgba(255, 240, 230, 0.95);
  }

  .choice .title {
    font-size: 1.02rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .choice .desc {
    margin-top: 4px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  .badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: 0.04em;
    color: #fff;
  }

  .badge.infra { background: var(--infra); }
  .badge.app { background: var(--app); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  button.btn {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s, background 0.15s;
  }

  button.btn:active { transform: scale(0.98); }
  button.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-primary {
    background: linear-gradient(135deg, #e87840, #c45c3a);
    color: #fff;
    box-shadow: 0 4px 14px rgba(196, 92, 58, 0.35);
  }

  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #f08850, #d46848);
  }

  .btn-ghost {
    background: rgba(255, 255, 255, 0.55);
    color: var(--ink-soft);
    border: 1px solid rgba(80, 110, 150, 0.2);
  }

  .btn-ghost:hover { background: rgba(255, 255, 255, 0.85); }

  .btn-block { flex: 1; min-width: 120px; }

  .summary-box {
    background: rgba(255, 255, 255, 0.65);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    border: 1px solid rgba(80, 110, 150, 0.15);
  }

  .summary-box p {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--ink);
  }

  .summary-box .meta {
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 14px 0;
  }

  .stat {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid rgba(80, 110, 150, 0.12);
  }

  .stat .label {
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .stat .value {
    font-size: 1.15rem;
    font-weight: 700;
    margin-top: 2px;
    color: var(--ink);
  }

  .stat .bar {
    margin-top: 6px;
    height: 5px;
    background: rgba(80, 110, 150, 0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .stat .bar > i {
    display: block;
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--infra), var(--accent-soft));
  }

  .flavour {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--ink-soft);
    border-left: 3px solid var(--accent-soft);
    padding-left: 12px;
    margin: 12px 0 4px;
    font-style: italic;
  }

  .salary {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--good);
    margin-top: 4px;
  }

  footer.foot {
    position: relative;
    z-index: 10;
    margin-top: 14px;
    text-align: center;
    font-size: 0.7rem;
    color: rgba(255, 245, 230, 0.65);
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }

  @media (max-width: 420px) {
    .logo h1 { font-size: 1.55rem; }
    .panel { padding: 22px 18px 20px; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="glow-orb" aria-hidden="true"></div>
  <div class="shafts" aria-hidden="true"></div>
  <div class="clouds" aria-hidden="true"></div>
  <div class="city" aria-hidden="true"></div>

  <div class="app">
    <!-- 標題 -->
    <section id="screen-title" class="panel">
      <div class="logo">
        <h1>香港IT人</h1>
        <p class="sub">簡單版 · 開局試玩</p>
      </div>
      <p class="lead" style="text-align:center;margin-top:16px;">
        由畢業到第一份工——揀學歷、入職，睇吓第一個月點過。
      </p>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-block" id="btn-start">開始</button>
      </div>
      <p class="art-note">畫面空氛為原創漸層／光影（受動畫電影天空美學啟發），並非任何版權作品素材。</p>
    </section>

    <!-- 學歷 -->
    <section id="screen-edu" class="panel hidden">
      <span class="step-tag">步驟 1／3</span>
      <h2>你點樣畢業？</h2>
      <p class="lead">學歷會影響可揀嘅入職職位同起步條件。</p>
      <div class="choices" id="edu-choices"></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-back="title">返回</button>
        <button type="button" class="btn btn-primary btn-block" id="btn-edu-next" disabled>下一步：揀職位</button>
      </div>
    </section>

    <!-- 職位 -->
    <section id="screen-job" class="panel hidden">
      <span class="step-tag">步驟 2／3</span>
      <h2>入職職位</h2>
      <p class="lead" id="job-lead">揀你第一份工。Infra 向同 App 向都有。</p>
      <div class="choices" id="job-choices"></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-back="edu">返回</button>
        <button type="button" class="btn btn-primary btn-block" id="btn-job-next" disabled>確認入職</button>
      </div>
    </section>

    <!-- 確認 -->
    <section id="screen-confirm" class="panel hidden">
      <span class="step-tag">步驟 3／3</span>
      <h2>確認 Offer</h2>
      <div class="summary-box" id="confirm-summary"></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-back="job">返回改職位</button>
        <button type="button" class="btn btn-primary btn-block" id="btn-accept">接受聘用，上班去</button>
      </div>
    </section>

    <!-- 第一個月結果 -->
    <section id="screen-result" class="panel hidden">
      <span class="step-tag">第一個月</span>
      <h2 id="result-title">入職滿月</h2>
      <p class="flavour" id="result-flavour"></p>
      <div class="summary-box" style="margin-top:14px;">
        <p id="result-jobline"></p>
        <p class="salary" id="result-salary"></p>
        <p class="meta" id="result-company"></p>
      </div>
      <div class="stats" id="result-stats"></div>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-block" id="btn-replay">再玩一次</button>
      </div>
      <p class="art-note">完整版將以 Godot 展開約 40 年職涯模擬。本頁只係開局手感驗證。</p>
    </section>

    <footer class="foot">hkitguy · 《香港IT人》簡單版 v0.1</footer>
  </div>

<script>
(function () {
  "use strict";

  const EDU = {

      id: "diploma",
      title: "綜合畢業",
      desc: "高文憑／副學士／IVE 等實務路徑。入行偏支援同運維，腳踏實地。"
    },
    uni: {
      id: "uni",
      title: "大學畢業",
      desc: "學士學位。開發／分析職位較易開，起薪帶通常略高。"
    }
  };

  /** @type {Record<string, Array<object>>} */
  const JOBS = {
    diploma: [
      {
        id: "helpdesk",
        title: "Helpdesk 技術員",
        track: "infra",
        salary: "14,000–16,500",
        company: "半島 MSP（虛構）",
        stats: { infra: 28, app: 12, manage: 8, influence: 10, health: 78 },
        flavour: "第一個月：電話響過不停，password reset 做到手軟。茶餐廳午餐聽前輩講「慢慢學，唔好死火。」你搞掂咗第一張 P1 ticket。"
      },
      {
        id: "desktop",
        title: "Desktop Support",
        track: "infra",
        salary: "15,000–17,000",
        company: "港灣零售 IT（虛構）",
        stats: { infra: 30, app: 10, manage: 6, influence: 8, health: 74 },
        flavour: "第一個月：落 spot 裝機、執線、教阿姐用新 POS。返工袋永遠有幾條 HDMI。你開始认得邊條樓層 Wi‑Fi 最廢。"
      },
      {
        id: "noc",
        title: "NOC 值班員",
        track: "infra",
        salary: "15,500–18,000",
        company: "雲港數據中心（虛構）",
        stats: { infra: 32, app: 8, manage: 5, influence: 6, health: 68 },
        flavour: "第一個月：夜更螢幕藍光映住面。警報一響心跳加速——結果係 false positive。前輩話：「歡迎嚟 Infra，瞓得好係奢侈。」"
      },
      {
        id: "sysadmin-jr",
        title: "Sysadmin Junior",
        track: "infra",
        salary: "16,000–18,500",
        company: "海旁金融 IT 外判（虛構）",
        stats: { infra: 34, app: 14, manage: 8, influence: 10, health: 72 },
        flavour: "第一個月：跟住 patch、backup、睇 monitoring。你第一次改 production change，手震但成功。Team lead 請咗杯凍檸茶。"
      },
      {
        id: "app-support",
        title: "Application Support",
        track: "app",
        salary: "15,000–17,500",
        company: "城中物流系統部（虛構）",
        stats: { infra: 14, app: 28, manage: 10, influence: 12, health: 76 },
        flavour: "第一個月：用戶話「個系統死咗」——多數係 cache。你學識用 log 同溫柔語氣安撫業務。第一單 UAT 終於過數。"
      },
      {
        id: "junior-dev-dip",
        title: "Junior Developer",
        track: "app",
        salary: "16,500–19,000",
        company: "灣仔初創「碼上」（虛構）",
        stats: { infra: 10, app: 32, manage: 6, influence: 8, health: 70 },
        flavour: "第一個月：第一個 PR 被人 comment 到滿紅。你熬夜改完，merge 嗰刻好似黄昏天空咁亮。綜合畢業入開發，你覺得自己要再勁啲。"
      }
    ],
    uni: [
      {
        id: "helpdesk-uni",
        title: "Helpdesk 技術員",
        track: "infra",
        salary: "15,000–17,000",
        company: "半島 MSP（虛構）",
        stats: { infra: 26, app: 14, manage: 10, influence: 14, health: 80 },
        flavour: "第一個月：學位入 Helpdesk，有人笑你「屈就」。你反而學識基層 ticket 先至係根。第一個月績效唔錯，人話你可以轉組。"
      },
      {
        id: "sysadmin-uni",
        title: "Sysadmin Junior",
        track: "infra",
        salary: "18,000–21,000",
        company: "海旁金融 IT（虛構）",
        stats: { infra: 36, app: 16, manage: 10, influence: 14, health: 74 },
        flavour: "第一個月：跟雲遷移小組做文件同小腳手。你第一次入機房，冷氣同心跳一齊凍。前輩話：「大學理論有用，但 production 唔會依書。」"
      },
      {
        id: "cloud-trainee",
        title: "Cloud／Infra Trainee",
        track: "infra",
        salary: "19,000–22,000",
        company: "數碼港方向雲服務商（虛構）",
        stats: { infra: 38, app: 18, manage: 8, influence: 12, health: 72 },
        flavour: "第一個月：IAM、VPC、監控 dashboard 塞滿腦。你搞掂第一個 staging 環境，夕陽透過玻璃幕牆打進來，好似開咗光柱。"
      },
      {
        id: "junior-dev",
        title: "Junior Developer",
        track: "app",
        salary: "20,000–24,000",
        company: "中環企業數碼部（虛構）",
        stats: { infra: 12, app: 38, manage: 8, influence: 12, health: 72 },
        flavour: "第一個月：sprint 節奏趕過港鐵。你交咗第一個小 feature，QA 打回頭兩次。站會上你終於敢開波講 blocker。"
      },
      {
        id: "ba-junior",
        title: "BA Junior／系統分析見習",
        track: "app",
        salary: "18,500–22,000",
        company: "九龍銀行科技夥伴（虛構）",
        stats: { infra: 10, app: 30, manage: 16, influence: 20, health: 76 },
        flavour: "第一個月：會議多過 code。你寫第一份 BRD，被業務改到面目全非。你開始明白：聽人講需求，同聽得明，係兩件事。"
      },
      {
        id: "app-support-uni",
        title: "Application Support",
        track: "app",
        salary: "17,000–20,000",
        company: "城中物流系統部（虛構）",
        stats: { infra: 14, app: 30, manage: 12, influence: 16, health: 78 },
        flavour: "第一個月：跟 release、睇 error log、教用戶。你用學位背景寫咗份簡易 runbook，team 話「終於有人肯寫低」。"
      }
    ]
  };

  const state = {
    edu: null,
    job: null
  };

  const $ = (id) => document.getElementById(id);

  function show(name) {
    ["title", "edu", "job", "confirm", "result"].forEach((n) => {
      const el = $("screen-" + n);
      if (!el) return;
      el.classList.toggle("hidden", n !== name);
      if (n === name) {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      }
    });
  }

  function trackLabel(t) {
    return t === "infra" ? "Infra" : "App";
  }

  function renderEdu() {
    const box = $("edu-choices");
    box.innerHTML = "";
    Object.values(EDU).forEach((e) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (state.edu === e.id ? " selected" : "");
      btn.innerHTML =
        '<div class="title">' + e.title + "</div>" +
        '<div class="desc">' + e.desc + "</div>";
      btn.addEventListener("click", () => {
        state.edu = e.id;
        state.job = null;
        renderEdu();
        $("btn-edu-next").disabled = false;
      });
      box.appendChild(btn);
    });
  }

  function renderJobs() {
    const list = JOBS[state.edu] || [];
    const box = $("job-choices");
    box.innerHTML = "";
    $("job-lead").textContent =
      state.edu === "uni"
        ? "大學畢業：開發／雲／BA 選擇較多，起薪帶通常略高。Infra 同 App 都有。"
        : "綜合畢業：支援／運維入門穩陣；Junior Dev 亦有得試。Infra 同 App 都有。";

    list.forEach((j) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (state.job === j.id ? " selected" : "");
      const badgeClass = j.track === "infra" ? "infra" : "app";
      btn.innerHTML =
        '<div class="title"><span class="badge ' + badgeClass + '">' + trackLabel(j.track) +
        "</span>" + j.title + "</div>" +
        '<div class="desc">月薪約 HK$' + j.salary + " · " + j.company + "</div>";
      btn.addEventListener("click", () => {
        state.job = j.id;
        renderJobs();
        $("btn-job-next").disabled = false;
      });
      box.appendChild(btn);
    });
  }

  function currentJob() {
    const list = JOBS[state.edu] || [];
    return list.find((j) => j.id === state.job) || null;
  }

  function renderConfirm() {
    const edu = EDU[state.edu];
    const job = currentJob();
    if (!edu || !job) return;
    $("confirm-summary").innerHTML =
      "<p><strong>" + edu.title + "</strong> → <strong>" + job.title + "</strong>" +
      ' <span class="badge ' + (job.track === "infra" ? "infra" : "app") + '">' +
      trackLabel(job.track) + "</span></p>" +
      '<p class="meta">雇主：' + job.company + "</p>" +
      '<p class="salary">建議起薪：HK$' + job.salary + "／月</p>" +
      '<p class="meta" style="margin-top:8px;">接受之後會進入「第一個月」結算（簡單版）。</p>';
  }

  function renderResult() {
    const edu = EDU[state.edu];
    const job = currentJob();
    if (!edu || !job) return;
    $("result-title").textContent = "入職滿月 · " + job.title;
    $("result-flavour").textContent = job.flavour;
    $("result-jobline").innerHTML =
      "<strong>" + edu.title + "</strong> 入職 <strong>" + job.title + "</strong>（" +
      trackLabel(job.track) + "）";
    $("result-salary").textContent = "目前薪級：HK$" + job.salary + "／月";
    $("result-company").textContent = "服務於 " + job.company;

    const labels = {
      infra: "Infra 力",
      app: "App 力",
      manage: "管理力",
      influence: "影響力",
      health: "健康"
    };
    const box = $("result-stats");
    box.innerHTML = "";
    Object.keys(labels).forEach((k) => {
      const v = job.stats[k];
      const div = document.createElement("div");
      div.className = "stat";
      div.innerHTML =
        '<div class="label">' + labels[k] + "</div>" +
        '<div class="value">' + v + "</div>" +
        '<div class="bar"><i style="width:' + Math.min(100, v) + '%"></i></div>';
      box.appendChild(div);
    });
  }

  $("btn-start").addEventListener("click", () => {
    state.edu = null;
    state.job = null;
    $("btn-edu-next").disabled = true;
    renderEdu();
    show("edu");
  });

  $("btn-edu-next").addEventListener("click", () => {
    if (!state.edu) return;
    $("btn-job-next").disabled = true;
    renderJobs();
    show("job");
  });

  $("btn-job-next").addEventListener("click", () => {
    if (!state.job) return;
    renderConfirm();
    show("confirm");
  });

  $("btn-accept").addEventListener("click", () => {
    renderResult();
    show("result");
  });

  $("btn-replay").addEventListener("click", () => {
    state.edu = null;
    state.job = null;
    show("title");
  });

  document.querySelectorAll("[data-back]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const t = btn.getAttribute("data-back");
      if (t === "title") show("title");
      else if (t === "edu") {
        renderEdu();
        $("btn-edu-next").disabled = !state.edu;
        show("edu");
      } else if (t === "job") {
        renderJobs();
        $("btn-job-next").disabled = !state.job;
        show("job");
      }
    });
  });
})();
</script>
</body>
</html>
